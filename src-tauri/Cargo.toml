[package]
name = "yapflow"
version = "0.2.8"
description = "YapFlow native voice writing assistant"
authors = ["YapFlow"]
edition = "2021"

[lib]
name = "yapflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
active-win-pos-rs = "0.11"
anyhow = "1"
arboard = { version = "3", default-features = false }
cpal = "0.16"
dirs = "6"
encoding_rs = "0.8"
enigo = "0.6.1"
hound = "3.5"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.0"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "time"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"
wasapi = "0.24.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
